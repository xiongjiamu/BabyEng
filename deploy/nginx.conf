# BabyEng nginx 反代（PRD 9.1：HTTPS → nginx → Rust 后端 / 静态 PWA）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=()" always;

    # gzip 静态资源
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # PWA：单页应用回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service Worker 与 manifest 不缓存（更新即时生效）
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # API 反代到 Rust 后端
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 20m;   # 录音上传
    }

    # 音频静态文件（录音回放由 backend 接口提供，此处兜底缓存）
    location ~* \.(wav|opus|ogg|webm|m4a|mp3)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}

# HTTPS：用 Let's Encrypt 证书或自签（PRD 9.2：录音权限必须 HTTPS）
# 参考：certbot --nginx -d babyeng.home.lan
